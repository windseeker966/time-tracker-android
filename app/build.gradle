plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wind.timetracker'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wind.timetracker'
        minSdk 29
        targetSdk 36
        versionCode 15
        versionName '0.8.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
